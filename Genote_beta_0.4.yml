    - data:
        code: "\"\"\"\nDify 代码节点: 文本分片器\n节点名称: text_chunker\n功能: 将长文本切分为逻辑块，为 Map-Reduce\
          \ 总结做准备\n      解决长文本\"注意力丢失\"问题\n\n输入变量:\n- text: 待分片的文本内容\n- chunk_size:\
          \ 目标分片大小(字符数)，默认10000\n- overlap: 分片重叠字符数，默认200\n\n输出变量:\n- chunks: 分片列表\n\
          - chunk_count: 分片数量\n- total_chars: 总字符数\n- needs_chunking: 是否需要分片 (文本量>15000字)\n\
          - error_message: 错误信息\n\n分片策略:\n1. 若文本量 <= 15000 字，不分片，直接返回\n2. 若文本量 > 15000\
          \ 字，按段落边界切分为 ~10000 字/块\n3. 分片之间有 200 字重叠，确保上下文连贯\n\"\"\"\n\nimport re\n\
          \n\n# 分片配置\nchunk_size = 10000\noverlap = 200\nDEFAULT_CHUNK_SIZE = 10000\
          \      # 默认分片大小\nCHUNK_THRESHOLD = 15000         # 分片阈值\nDEFAULT_OVERLAP\
          \ = 200           # 默认重叠字符数\nMIN_CHUNK_SIZE = 2000           # 最小分片大小\n\n\
          \ndef main(text: str) -> dict:\n    \"\"\"\n    主函数: 文本分片\n    \"\"\"\n\
          \    try:\n        # 验证输入\n        if not text or not text.strip():\n  \
          \          return {\n                \"chunks\": [],\n                \"\
          chunk_count\": 0,\n                \"total_chars\": 0,\n               \
          \ \"needs_chunking\": False,\n                \"error_message\": \"\"\n\
          \            }\n        \n        # 清理文本\n        text = clean_text(text)\n\
          \        total_chars = len(text)\n        \n        # 判断是否需要分片\n       \
          \ if total_chars <= CHUNK_THRESHOLD:\n            return {\n           \
          \     \"chunks\": [text],\n                \"chunk_count\": 1,\n       \
          \         \"total_chars\": total_chars,\n                \"needs_chunking\"\
          : False,\n                \"error_message\": \"\"\n            }\n     \
          \   \n        # 执行分片\n        chunks = smart_chunk(text, chunk_size, overlap)\n\
          \        \n        return {\n            \"chunks\": chunks,\n         \
          \   \"chunk_count\": len(chunks),\n            \"total_chars\": total_chars,\n\
          \            \"needs_chunking\": True,\n            \"error_message\": \"\
          \"\n        }\n        \n    except Exception as e:\n        return {\n\
          \            \"chunks\": [],\n            \"chunk_count\": 0,\n        \
          \    \"total_chars\": 0,\n            \"needs_chunking\": False,\n     \
          \       \"error_message\": f\"文本分片失败: {str(e)}\"\n        }\n\n\ndef clean_text(text:\
          \ str) -> str:\n    \"\"\"\n    清理文本\n    \"\"\"\n    # 移除多余空白\n    text\
          \ = re.sub(r'\\n{3,}', '\\n\\n', text)\n    text = re.sub(r' {3,}', '  ',\
          \ text)\n    \n    # 移除控制字符\n    text = re.sub(r'[\\x00-\\x08\\x0b\\x0c\\\
          x0e-\\x1f\\x7f]', '', text)\n    \n    return text.strip()\n\n\ndef smart_chunk(text:\
          \ str, chunk_size: int, overlap: int) -> list:\n    \"\"\"\n    智能分片: 按段落边界切分，保持语义完整性\n\
          \    \"\"\"\n    chunks = []\n    \n    # 首先按段落分割\n    paragraphs = split_into_paragraphs(text)\n\
          \    \n    current_chunk = []\n    current_size = 0\n    \n    for para\
          \ in paragraphs:\n        para_size = len(para)\n        \n        # 如果单个段落超过分片大小，需要进一步切分\n\
          \        if para_size > chunk_size:\n            # 先保存当前累积的内容\n        \
          \    if current_chunk:\n                chunks.append('\\n\\n'.join(current_chunk))\n\
          \                current_chunk = []\n                current_size = 0\n\
          \            \n            # 切分大段落\n            sub_chunks = split_large_paragraph(para,\
          \ chunk_size, overlap)\n            chunks.extend(sub_chunks)\n        \
          \    continue\n        \n        # 检查是否需要开始新分片\n        if current_size\
          \ + para_size > chunk_size and current_chunk:\n            # 保存当前分片\n  \
          \          chunk_text = '\\n\\n'.join(current_chunk)\n            chunks.append(chunk_text)\n\
          \            \n            # 开始新分片，保留重叠部分\n            overlap_paras = get_overlap_paragraphs(current_chunk,\
          \ overlap)\n            current_chunk = overlap_paras\n            current_size\
          \ = sum(len(p) for p in current_chunk)\n        \n        # 添加段落到当前分片\n\
          \        current_chunk.append(para)\n        current_size += para_size\n\
          \    \n    # 保存最后一个分片\n    if current_chunk:\n        chunks.append('\\\
          n\\n'.join(current_chunk))\n    \n    # 后处理: 合并过小的分片\n    chunks = merge_small_chunks(chunks,\
          \ MIN_CHUNK_SIZE)\n    \n    return chunks\n\n\ndef split_into_paragraphs(text:\
          \ str) -> list:\n    \"\"\"\n    将文本分割为段落\n    \"\"\"\n    # 按双换行或时间戳标记分割\n\
          \    paragraphs = re.split(r'\\n\\n+|\\n(?=\\[\\d{1,2}:\\d{2})', text)\n\
          \    \n    # 过滤空段落\n    paragraphs = [p.strip() for p in paragraphs if p.strip()]\n\
          \    \n    return paragraphs\n\n\ndef split_large_paragraph(para: str, chunk_size:\
          \ int, overlap: int) -> list:\n    \"\"\"\n    切分超大段落\n    按句子边界切分\n   \
          \ \"\"\"\n    chunks = []\n    \n    # 按句子分割\n    sentences = split_into_sentences(para)\n\
          \    \n    current_chunk = []\n    current_size = 0\n    \n    for sentence\
          \ in sentences:\n        sent_size = len(sentence)\n        \n        #\
          \ 如果单个句子超过分片大小，强制切分\n        if sent_size > chunk_size:\n            if\
          \ current_chunk:\n                chunks.append(''.join(current_chunk))\n\
          \                current_chunk = []\n                current_size = 0\n\
          \            \n            # 强制按字符切分\n            for i in range(0, sent_size,\
          \ chunk_size - overlap):\n                end = min(i + chunk_size, sent_size)\n\
          \                chunks.append(sentence[i:end])\n            continue\n\
          \        \n        # 检查是否需要开始新分片\n        if current_size + sent_size >\
          \ chunk_size and current_chunk:\n            chunks.append(''.join(current_chunk))\n\
          \            \n            # 保留重叠\n            overlap_text = ''.join(current_chunk)[-overlap:]\
          \ if overlap > 0 else ''\n            current_chunk = [overlap_text] if\
          \ overlap_text else []\n            current_size = len(overlap_text)\n \
          \       \n        current_chunk.append(sentence)\n        current_size +=\
          \ sent_size\n    \n    if current_chunk:\n        chunks.append(''.join(current_chunk))\n\
          \    \n    return chunks\n\n\ndef split_into_sentences(text: str) -> list:\n\
          \    \"\"\"\n    将文本分割为句子\n    \"\"\"\n    # 中英文句子分割\n    pattern = r'(?<=[。！？.!?])\\\
          s*'\n    sentences = re.split(pattern, text)\n    \n    # 过滤空句子\n    sentences\
          \ = [s.strip() for s in sentences if s.strip()]\n    \n    return sentences\n\
          \n\ndef get_overlap_paragraphs(paragraphs: list, overlap: int) -> list:\n\
          \    \"\"\"\n    获取重叠部分的段落\n    \"\"\"\n    if not paragraphs or overlap\
          \ <= 0:\n        return []\n    \n    # 从后往前累积，直到达到重叠字符数\n    overlap_paras\
          \ = []\n    total_size = 0\n    \n    for para in reversed(paragraphs):\n\
          \        if total_size >= overlap:\n            break\n        overlap_paras.insert(0,\
          \ para)\n        total_size += len(para)\n    \n    return overlap_paras\n\
          \n\ndef merge_small_chunks(chunks: list, min_size: int) -> list:\n    \"\
          \"\"\n    合并过小的分片\n    \"\"\"\n    if len(chunks) <= 1:\n        return\
          \ chunks\n    \n    merged = []\n    current = chunks[0]\n    \n    for\
          \ i in range(1, len(chunks)):\n        if len(current) < min_size:\n   \
          \         # 当前分片太小，与下一个合并\n            current = current + '\\n\\n' + chunks[i]\n\
          \        else:\n            merged.append(current)\n            current\
          \ = chunks[i]\n    \n    # 添加最后一个分片\n    if current:\n        # 如果最后一个分片太小，与前一个合并\n\
          \        if len(current) < min_size and merged:\n            merged[-1]\
          \ = merged[-1] + '\\n\\n' + current\n        else:\n            merged.append(current)\n\
          \    \n    return merged\n"
        code_language: python3
