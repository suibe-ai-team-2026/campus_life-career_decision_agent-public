    - data:
        code: "\"\"\"\nDify 代码节点: 文档多路解析模块\n节点名称: document_parser\n功能: 根据文档子类型选择合适的解析策略\n\
          \n输入变量:\n- file_url: 文件URL\n- file_subtype: 文件子类型 (pdf/ppt/docx/txt)\n\n\
          输出变量:\n- extracted_text: 提取的文本内容\n- doc_type: 文档类型描述\n- page_count: 页数/幻灯片数\n\
          - needs_visual_analysis: 是否需要视觉分析 (PPT)\n- visual_slides: 需要视觉分析的幻灯片索引列表\n\
          - error_message: 错误信息\n\"\"\"\n\nimport io\nimport re\nfrom urllib import\
          \ request\nfrom urllib.error import URLError\n\n\ndef main(file_url: str,\
          \ file_subtype: str) -> dict:\n    \"\"\"\n    主函数: 文档多路解析\n    \"\"\"\n\
          \    try:\n        if not file_url:\n            return {\n            \
          \    \"extracted_text\": \"\",\n                \"doc_type\": \"unknown\"\
          ,\n                \"page_count\": 0,\n                \"needs_visual_analysis\"\
          : False,\n                \"visual_slides\": [],\n                \"error_message\"\
          : \"未提供文件URL\"\n            }\n        \n        # 根据子类型选择解析策略\n       \
          \ if file_subtype == \"pdf\":\n            return parse_pdf(file_url)\n\
          \        elif file_subtype == \"ppt\":\n            return parse_ppt(file_url)\n\
          \        elif file_subtype == \"docx\":\n            return parse_docx(file_url)\n\
          \        elif file_subtype == \"txt\":\n            return parse_txt(file_url)\n\
          \        else:\n            return {\n                \"extracted_text\"\
          : \"\",\n                \"doc_type\": \"unknown\",\n                \"\
          page_count\": 0,\n                \"needs_visual_analysis\": False,\n  \
          \              \"visual_slides\": [],\n                \"error_message\"\
          : f\"不支持的文档类型: {file_subtype}\"\n            }\n            \n    except\
          \ Exception as e:\n        return {\n            \"extracted_text\": \"\"\
          ,\n            \"doc_type\": \"error\",\n            \"page_count\": 0,\n\
          \            \"needs_visual_analysis\": False,\n            \"visual_slides\"\
          : [],\n            \"error_message\": f\"文档解析失败: {str(e)}\"\n        }\n\
          \n\ndef download_file(url: str) -> bytes:\n    \"\"\"\n    下载文件内容\n    \"\
          \"\"\n    try:\n        req = request.Request(url)\n        req.add_header('User-Agent',\
          \ 'Mozilla/5.0')\n        with request.urlopen(req, timeout=60) as response:\n\
          \            return response.read()\n    except URLError as e:\n       \
          \ raise Exception(f\"文件下载失败: {str(e)}\")\n\n\ndef parse_pdf(file_url: str)\
          \ -> dict:\n    \"\"\"\n    解析 PDF 文件\n    使用 PyMuPDF (fitz) 进行布局分析，支持双栏排版\n\
          \    \n    注意: 此代码需要在 Dify 中配置 PyMuPDF 依赖\n    如果不可用，将回退到基础解析\n    \"\"\"\
          \n    try:\n        # 下载文件\n        file_data = download_file(file_url)\n\
          \        \n        # 尝试使用 PyMuPDF\n        try:\n            import fitz\
          \  # PyMuPDF\n            \n            # 从内存加载 PDF\n            doc = fitz.open(stream=file_data,\
          \ filetype=\"pdf\")\n            \n            extracted_text = []\n   \
          \         page_count = len(doc)\n            \n            for page_num\
          \ in range(page_count):\n                page = doc[page_num]\n        \
          \        \n                # 使用布局保持模式提取文本\n                # 这对双栏排版特别有效\n\
          \                text = page.get_text(\"text\", sort=True)\n           \
          \     \n                # 清理文本\n                text = clean_text(text)\n\
          \                \n                if text.strip():\n                  \
          \  extracted_text.append(f\"【第{page_num + 1}页】\\n{text}\")\n           \
          \ \n            doc.close()\n            \n            return {\n      \
          \          \"extracted_text\": \"\\n\\n\".join(extracted_text),\n      \
          \          \"doc_type\": \"PDF文档\",\n                \"page_count\": page_count,\n\
          \                \"needs_visual_analysis\": False,\n                \"visual_slides\"\
          : [],\n                \"error_message\": \"\"\n            }\n        \
          \    \n        except ImportError:\n            # PyMuPDF 不可用，使用 Dify 内置解析器\n\
          \            return {\n                \"extracted_text\": \"[请使用Dify内置文档解析器处理此PDF]\"\
          ,\n                \"doc_type\": \"PDF文档\",\n                \"page_count\"\
          : 0,\n                \"needs_visual_analysis\": False,\n              \
          \  \"visual_slides\": [],\n                \"error_message\": \"PyMuPDF未安装，请使用Dify内置解析器\"\
          \n            }\n            \n    except Exception as e:\n        return\
          \ {\n            \"extracted_text\": \"\",\n            \"doc_type\": \"\
          PDF文档\",\n            \"page_count\": 0,\n            \"needs_visual_analysis\"\
          : False,\n            \"visual_slides\": [],\n            \"error_message\"\
          : f\"PDF解析失败: {str(e)}\"\n        }\n\n\ndef parse_ppt(file_url: str) ->\
          \ dict:\n    \"\"\"\n    解析 PPT/PPTX 文件\n    识别为\"视觉课件\"，标记需要 Qwen-VL 视觉分析的幻灯片\n\
          \    \"\"\"\n    try:\n        # 下载文件\n        file_data = download_file(file_url)\n\
          \        \n        try:\n            from pptx import Presentation\n   \
          \         from pptx.enum.shapes import MSO_SHAPE_TYPE\n            \n  \
          \          # 从内存加载 PPTX\n            prs = Presentation(io.BytesIO(file_data))\n\
          \            \n            extracted_text = []\n            visual_slides\
          \ = []  # 需要视觉分析的幻灯片索引\n            slide_count = len(prs.slides)\n    \
          \        \n            for idx, slide in enumerate(prs.slides):\n      \
          \          slide_num = idx + 1\n                slide_text = []\n      \
          \          has_complex_visual = False\n                \n              \
          \  for shape in slide.shapes:\n                    # 检测复杂视觉元素\n        \
          \            if shape.shape_type in [\n                        MSO_SHAPE_TYPE.PICTURE,\n\
          \                        MSO_SHAPE_TYPE.CHART,\n                       \
          \ MSO_SHAPE_TYPE.DIAGRAM,\n                        MSO_SHAPE_TYPE.CANVAS,\n\
          \                        MSO_SHAPE_TYPE.FREEFORM,\n                    \
          \    MSO_SHAPE_TYPE.GROUP\n                    ]:\n                    \
          \    has_complex_visual = True\n                    \n                 \
          \   # 提取文本\n                    if hasattr(shape, \"text\") and shape.text.strip():\n\
          \                        slide_text.append(shape.text.strip())\n       \
          \             \n                    # 处理表格\n                    if shape.has_table:\n\
          \                        table_text = extract_table_text(shape.table)\n\
          \                        slide_text.append(table_text)\n               \
          \ \n                # 如果有复杂视觉元素，标记需要视觉分析\n                if has_complex_visual:\n\
          \                    visual_slides.append(slide_num)\n                \n\
          \                if slide_text:\n                    extracted_text.append(f\"\
          【幻灯片{slide_num}】\\n\" + \"\\n\".join(slide_text))\n            \n      \
          \      # 判断是否需要视觉分析\n            needs_visual = len(visual_slides) > 0\n\
          \            \n            return {\n                \"extracted_text\"\
          : \"\\n\\n\".join(extracted_text),\n                \"doc_type\": \"视觉课件(PPT)\"\
          ,\n                \"page_count\": slide_count,\n                \"needs_visual_analysis\"\
          : needs_visual,\n                \"visual_slides\": visual_slides,\n   \
          \             \"error_message\": \"\"\n            }\n            \n   \
          \     except ImportError:\n            return {\n                \"extracted_text\"\
          : \"[请使用Dify内置解析器处理此PPT]\",\n                \"doc_type\": \"视觉课件(PPT)\"\
          ,\n                \"page_count\": 0,\n                \"needs_visual_analysis\"\
          : True,\n                \"visual_slides\": [],\n                \"error_message\"\
          : \"python-pptx未安装，请使用Dify内置解析器\"\n            }\n            \n    except\
          \ Exception as e:\n        return {\n            \"extracted_text\": \"\"\
          ,\n            \"doc_type\": \"视觉课件(PPT)\",\n            \"page_count\"\
          : 0,\n            \"needs_visual_analysis\": False,\n            \"visual_slides\"\
          : [],\n            \"error_message\": f\"PPT解析失败: {str(e)}\"\n        }\n\
          \n\ndef extract_table_text(table) -> str:\n    \"\"\"\n    从 PPT 表格中提取文本\n\
          \    \"\"\"\n    try:\n        rows = []\n        for row in table.rows:\n\
          \            cells = []\n            for cell in row.cells:\n          \
          \      cells.append(cell.text.strip())\n            rows.append(\" | \"\
          .join(cells))\n        return \"\\n\".join(rows)\n    except Exception:\n\
          \        return \"[表格内容]\"\n\n\ndef parse_docx(file_url: str) -> dict:\n\
          \    \"\"\"\n    解析 Word 文档 (DOCX)\n    \"\"\"\n    try:\n        # 下载文件\n\
          \        file_data = download_file(file_url)\n        \n        try:\n \
          \           from docx import Document\n            \n            # 从内存加载\
          \ DOCX\n            doc = Document(io.BytesIO(file_data))\n            \n\
          \            extracted_text = []\n            \n            for para in\
          \ doc.paragraphs:\n                text = para.text.strip()\n          \
          \      if text:\n                    extracted_text.append(text)\n     \
          \       \n            # 提取表格\n            for table in doc.tables:\n   \
          \             table_text = []\n                for row in table.rows:\n\
          \                    cells = [cell.text.strip() for cell in row.cells]\n\
          \                    table_text.append(\" | \".join(cells))\n          \
          \      if table_text:\n                    extracted_text.append(\"\\n\"\
          .join(table_text))\n            \n            return {\n               \
          \ \"extracted_text\": \"\\n\\n\".join(extracted_text),\n               \
          \ \"doc_type\": \"Word文档\",\n                \"page_count\": 0,  # DOCX\
          \ 不易获取页数\n                \"needs_visual_analysis\": False,\n          \
          \      \"visual_slides\": [],\n                \"error_message\": \"\"\n\
          \            }\n            \n        except ImportError:\n            return\
          \ {\n                \"extracted_text\": \"[请使用Dify内置解析器处理此Word文档]\",\n\
          \                \"doc_type\": \"Word文档\",\n                \"page_count\"\
          : 0,\n                \"needs_visual_analysis\": False,\n              \
          \  \"visual_slides\": [],\n                \"error_message\": \"python-docx未安装，请使用Dify内置解析器\"\
          \n            }\n            \n    except Exception as e:\n        return\
          \ {\n            \"extracted_text\": \"\",\n            \"doc_type\": \"\
          Word文档\",\n            \"page_count\": 0,\n            \"needs_visual_analysis\"\
          : False,\n            \"visual_slides\": [],\n            \"error_message\"\
          : f\"Word解析失败: {str(e)}\"\n        }\n\n\ndef parse_txt(file_url: str) ->\
          \ dict:\n    \"\"\"\n    解析纯文本文件\n    \"\"\"\n    try:\n        # 下载文件\n\
          \        file_data = download_file(file_url)\n        \n        # 尝试多种编码\n\
          \        encodings = ['utf-8', 'gbk', 'gb2312', 'utf-16', 'latin-1']\n \
          \       text = None\n        \n        for encoding in encodings:\n    \
          \        try:\n                text = file_data.decode(encoding)\n     \
          \           break\n            except (UnicodeDecodeError, LookupError):\n\
          \                continue\n        \n        if text is None:\n        \
          \    text = file_data.decode('utf-8', errors='ignore')\n        \n     \
          \   # 清理文本\n        text = clean_text(text)\n        \n        return {\n\
          \            \"extracted_text\": text,\n            \"doc_type\": \"纯文本\"\
          ,\n            \"page_count\": 0,\n            \"needs_visual_analysis\"\
          : False,\n            \"visual_slides\": [],\n            \"error_message\"\
          : \"\"\n        }\n        \n    except Exception as e:\n        return\
          \ {\n            \"extracted_text\": \"\",\n            \"doc_type\": \"\
          纯文本\",\n            \"page_count\": 0,\n            \"needs_visual_analysis\"\
