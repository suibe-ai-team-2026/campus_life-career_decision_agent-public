    - data:
        code: "\"\"\"\nDify 代码节点: 短录音同步转写\n节点名称: speech_sync\n功能: 处理时长 < 2分钟的短录音，使用同步接口实现秒级响应\n\
          \n输入变量:\n- file_url: 音频文件URL\n- duration_seconds: 音频时长(秒)\n\n输出变量:\n- transcription_text:\
          \ 转写文本\n- transcription_status: 转写状态 (success/failed)\n- error_message:\
          \ 错误信息\n- processing_time_seconds: 处理耗时(秒)\n\n依赖:\n- dashscope SDK\n- 环境变量:\
          \ DASHSCOPE_API_KEY\n\"\"\"\n\nimport os\nimport time\nimport json\nfrom\
          \ urllib import request\nfrom urllib.error import URLError\n\n\ndef main(file_url:\
          \ str, duration_seconds: int) -> dict:\n    \"\"\"\n    主函数: 短录音同步转写\n \
          \   \"\"\"\n    start_time = time.time()\n    \n    try:\n        # 验证输入\n\
          \        if not file_url:\n            return {\n                \"transcription_text\"\
          : \"\",\n                \"transcription_status\": \"failed\",\n       \
          \         \"error_message\": \"未提供音频文件URL\",\n                \"processing_time_seconds\"\
          : 0\n            }\n        \n        # 验证时长限制 (安全检查)\n        if duration_seconds\
          \ >= 120:\n            return {\n                \"transcription_text\"\
          : \"\",\n                \"transcription_status\": \"failed\",\n       \
          \         \"error_message\": \"音频时长超过2分钟，请使用异步接口\",\n                \"\
          processing_time_seconds\": 0\n            }\n        \n        # 调用同步转写接口\n\
          \        transcription_text = call_sync_transcription(file_url)\n      \
          \  \n        processing_time = time.time() - start_time\n        \n    \
          \    return {\n            \"transcription_text\": transcription_text,\n\
          \            \"transcription_status\": \"success\",\n            \"error_message\"\
          : \"\",\n            \"processing_time_seconds\": round(processing_time,\
          \ 2)\n        }\n        \n    except Exception as e:\n        processing_time\
          \ = time.time() - start_time\n        return {\n            \"transcription_text\"\
          : \"\",\n            \"transcription_status\": \"failed\",\n           \
          \ \"error_message\": f\"同步转写失败: {str(e)}\",\n            \"processing_time_seconds\"\
          : round(processing_time, 2)\n        }\n\n\ndef call_sync_transcription(file_url:\
          \ str) -> str:\n    \"\"\"\n    调用阿里云百炼 Paraformer 同步转写接口\n    \n    对于短音频，使用\
          \ async_call + wait 组合实现同步效果\n    \"\"\"\n    try:\n        import dashscope\n\
          \        from dashscope.audio.asr import Transcription\n        \n     \
          \   # 获取 API Key (从环境变量或 Dify 配置)\n        api_key = os.environ.get('DASHSCOPE_API_KEY')\n\
          \        if api_key:\n            dashscope.api_key = api_key\n        \n\
          \        # 提交转写任务\n        task_response = Transcription.async_call(\n \
          \           model='paraformer-v1',\n            file_urls=[file_url],\n\
          \            language_hints=['zh', 'en']  # 支持中英文混合\n        )\n       \
          \ \n        # 检查任务提交是否成功\n        if not hasattr(task_response, 'output')\
          \ or not task_response.output:\n            raise Exception(\"任务提交失败，未获取到任务ID\"\
          )\n        \n        task_id = task_response.output.task_id\n        \n\
          \        # 等待任务完成 (同步等待)\n        transcription_response = Transcription.wait(task=task_id)\n\
          \        \n        # 检查任务状态\n        if transcription_response.output.task_status\
          \ != 'SUCCEEDED':\n            raise Exception(f\"转写任务失败: {transcription_response.output.task_status}\"\
          )\n        \n        # 获取转写结果\n        results = transcription_response.output.get('results',\
          \ [])\n        if not results:\n            raise Exception(\"未获取到转写结果\"\
          )\n        \n        # 下载并解析转写结果\n        transcription_url = results[0].get('transcription_url')\n\
          \        if not transcription_url:\n            raise Exception(\"未获取到转写结果URL\"\
          )\n        \n        # 获取转写文本\n        transcription_text = fetch_transcription_text(transcription_url)\n\
          \        \n        return transcription_text\n        \n    except ImportError:\n\
          \        # dashscope 未安装，使用 HTTP API\n        return call_sync_transcription_http(file_url)\n\
          \n\ndef call_sync_transcription_http(file_url: str) -> str:\n    \"\"\"\n\
          \    使用 HTTP API 调用转写接口 (备用方案)\n    \"\"\"\n    api_key = os.environ.get('DASHSCOPE_API_KEY',\
          \ '')\n    \n    # 提交任务\n    submit_url = \"https://dashscope.aliyuncs.com/api/v1/services/audio/asr/transcription\"\
          \n    \n    headers = {\n        \"Authorization\": f\"Bearer {api_key}\"\
          ,\n        \"Content-Type\": \"application/json\"\n    }\n    \n    payload\
          \ = {\n        \"model\": \"paraformer-v1\",\n        \"input\": {\n   \
          \         \"file_urls\": [file_url]\n        },\n        \"parameters\"\
          : {\n            \"language_hints\": [\"zh\", \"en\"]\n        }\n    }\n\
          \    \n    # 提交任务\n    req = request.Request(\n        submit_url,\n   \
          \     data=json.dumps(payload).encode('utf-8'),\n        headers=headers,\n\
          \        method='POST'\n    )\n    \n    with request.urlopen(req, timeout=30)\
          \ as response:\n        result = json.loads(response.read().decode('utf-8'))\n\
          \    \n    task_id = result.get('output', {}).get('task_id')\n    if not\
          \ task_id:\n        raise Exception(\"任务提交失败\")\n    \n    # 轮询等待结果 (短音频通常很快完成)\n\
          \    status_url = f\"https://dashscope.aliyuncs.com/api/v1/tasks/{task_id}\"\
          \n    \n    max_wait = 60  # 最多等待60秒\n    interval = 2   # 每2秒检查一次\n   \
          \ elapsed = 0\n    \n    while elapsed < max_wait:\n        time.sleep(interval)\n\
          \        elapsed += interval\n        \n        req = request.Request(status_url,\
          \ headers=headers)\n        with request.urlopen(req, timeout=10) as response:\n\
          \            status_result = json.loads(response.read().decode('utf-8'))\n\
          \        \n        task_status = status_result.get('output', {}).get('task_status')\n\
          \        \n        if task_status == 'SUCCEEDED':\n            results =\
          \ status_result.get('output', {}).get('results', [])\n            if results:\n\
          \                transcription_url = results[0].get('transcription_url')\n\
          \                return fetch_transcription_text(transcription_url)\n  \
          \          raise Exception(\"转写成功但未获取到结果\")\n        \n        elif task_status\
          \ in ['FAILED', 'CANCELED']:\n            raise Exception(f\"转写任务{task_status}\"\
          )\n    \n    raise Exception(\"转写超时\")\n\n\ndef fetch_transcription_text(transcription_url:\
          \ str) -> str:\n    \"\"\"\n    从转写结果URL获取文本\n    \"\"\"\n    try:\n   \
          \     req = request.Request(transcription_url)\n        with request.urlopen(req,\
          \ timeout=30) as response:\n            result = json.loads(response.read().decode('utf-8'))\n\
          \        \n        # 提取文本\n        transcripts = result.get('transcripts',\
          \ [])\n        if not transcripts:\n            return \"\"\n        \n\
          \        # 合并所有转写文本\n        text_parts = []\n        for transcript in\
          \ transcripts:\n            text = transcript.get('text', '')\n        \
          \    if text:\n                text_parts.append(text)\n        \n     \
          \   return '\\n'.join(text_parts)\n        \n    except Exception as e:\n\
          \        raise Exception(f\"获取转写结果失败: {str(e)}\")\n"
        code_language: python3
