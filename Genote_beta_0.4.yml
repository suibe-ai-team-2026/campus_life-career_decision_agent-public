    - data:
        code: "\"\"\"\nDify 代码节点: 长录音异步转写 + 轮询机制\n节点名称: speech_async\n功能: 处理时长 2分钟-5小时的长录音，使用异步接口\
          \ + 轮询机制\n      彻底规避 Dify 504 超时报错\n\n输入变量:\n- file_url: 音频文件URL\n- duration_seconds:\
          \ 音频时长(秒)\n\n输出变量:\n- transcription_text: 转写文本\n- transcription_status:\
          \ 转写状态 (success/failed/pending)\n- task_id: 任务ID (用于后续查询)\n- error_message:\
          \ 错误信息\n- processing_time_seconds: 处理耗时(秒)\n- poll_count: 轮询次数\n\n依赖:\n\
          - dashscope SDK 或 HTTP API\n- 环境变量: DASHSCOPE_API_KEY\n\n轮询策略:\n- 轮询间隔:\
          \ 30秒\n- 最大轮询次数: 基于音频时长动态计算\n- 超时保护: 最长等待时间 = 音频时长 * 1.5 + 300秒\n\"\"\"\n\
          \nimport os\nimport time\nimport json\nfrom urllib import request\nfrom\
          \ urllib.error import URLError\n\n\n# 轮询配置\nPOLL_INTERVAL = 30  # 轮询间隔(秒)\n\
          MIN_TIMEOUT = 300   # 最小超时时间(秒)\nTIMEOUT_MULTIPLIER = 1.5  # 超时时间倍数\n\n\n\
          def main(file_url: str, duration_seconds: int) -> dict:\n    \"\"\"\n  \
          \  主函数: 长录音异步转写\n    \"\"\"\n    start_time = time.time()\n    poll_count\
          \ = 0\n    \n    try:\n        # 验证输入\n        if not file_url:\n      \
          \      return create_response(\n                \"\", \"failed\", \"\",\
          \ \"未提供音频文件URL\", 0, 0\n            )\n        \n        # 验证时长限制 (安全检查)\n\
          \        if duration_seconds > 18000:  # 5小时\n            return create_response(\n\
          \                \"\", \"blocked\", \"\",\n                f\"音频时长约{duration_seconds/3600:.1f}小时，已超过单次处理上限（5小时），请分段上传以保证笔记精度。\"\
          ,\n                0, 0\n            )\n        \n        # 计算最大等待时间\n \
          \       max_wait_time = max(\n            duration_seconds * TIMEOUT_MULTIPLIER\
          \ + MIN_TIMEOUT,\n            MIN_TIMEOUT\n        )\n        max_polls\
          \ = int(max_wait_time / POLL_INTERVAL) + 1\n        \n        # 获取 API Key\n\
          \        api_key = os.environ.get('DASHSCOPE_API_KEY', '')\n        if not\
          \ api_key:\n            return create_response(\n                \"\", \"\
          failed\", \"\", \"未配置 DASHSCOPE_API_KEY\", 0, 0\n            )\n       \
          \ \n        # 步骤1: 提交异步任务\n        task_id = submit_transcription_task(file_url,\
          \ api_key)\n        \n        if not task_id:\n            return create_response(\n\
          \                \"\", \"failed\", \"\", \"任务提交失败，未获取到任务ID\", \n       \
          \         time.time() - start_time, 0\n            )\n        \n       \
          \ # 步骤2: 轮询等待结果\n        transcription_text = \"\"\n        task_status\
          \ = \"pending\"\n        error_message = \"\"\n        \n        while poll_count\
          \ < max_polls:\n            # 等待轮询间隔\n            time.sleep(POLL_INTERVAL)\n\
          \            poll_count += 1\n            \n            # 查询任务状态\n     \
          \       status_result = query_task_status(task_id, api_key)\n          \
          \  task_status = status_result.get('status', 'unknown')\n            \n\
          \            if task_status == 'SUCCEEDED':\n                # 任务成功，获取转写结果\n\
          \                transcription_url = status_result.get('transcription_url')\n\
          \                if transcription_url:\n                    transcription_text\
          \ = fetch_transcription_text(transcription_url)\n                break\n\
          \                \n            elif task_status in ['FAILED', 'CANCELED']:\n\
          \                # 任务失败\n                error_message = status_result.get('message',\
          \ f'任务{task_status}')\n                break\n                \n       \
          \     elif task_status == 'RUNNING':\n                # 任务进行中，继续轮询\n   \
          \             continue\n                \n            else:\n          \
          \      # 未知状态，继续轮询\n                continue\n        \n        # 检查是否超时\n\
          \        if poll_count >= max_polls and task_status not in ['SUCCEEDED',\
          \ 'FAILED', 'CANCELED']:\n            return create_response(\n        \
          \        \"\", \"timeout\", task_id,\n                f\"转写任务超时，已轮询{poll_count}次。任务ID:\
          \ {task_id}，可稍后手动查询。\",\n                time.time() - start_time, poll_count\n\
          \            )\n        \n        # 返回结果\n        processing_time = time.time()\
          \ - start_time\n        \n        if task_status == 'SUCCEEDED' and transcription_text:\n\
          \            return create_response(\n                transcription_text,\
          \ \"success\", task_id, \"\",\n                processing_time, poll_count\n\
          \            )\n        else:\n            return create_response(\n   \
          \             \"\", \"failed\", task_id, error_message or \"转写失败\",\n  \
          \              processing_time, poll_count\n            )\n        \n  \
          \  except Exception as e:\n        processing_time = time.time() - start_time\n\
          \        return create_response(\n            \"\", \"failed\", \"\", f\"\
          异步转写失败: {str(e)}\",\n            processing_time, poll_count\n        )\n\
          \n\ndef create_response(text: str, status: str, task_id: str, \n       \
          \            error: str, proc_time: float, polls: int) -> dict:\n    \"\"\
          \"\n    创建标准响应格式\n    \"\"\"\n    return {\n        \"transcription_text\"\
          : text,\n        \"transcription_status\": status,\n        \"task_id\"\
          : task_id,\n        \"error_message\": error,\n        \"processing_time_seconds\"\
          : round(proc_time, 2),\n        \"poll_count\": polls\n    }\n\n\ndef submit_transcription_task(file_url:\
          \ str, api_key: str) -> str:\n    \"\"\"\n    提交异步转写任务\n    返回任务ID\n   \
          \ \"\"\"\n    try:\n        # 尝试使用 dashscope SDK\n        try:\n       \
          \     import dashscope\n            from dashscope.audio.asr import Transcription\n\
          \            \n            dashscope.api_key = api_key\n            \n \
          \           task_response = Transcription.async_call(\n                model='paraformer-v1',\n\
          \                file_urls=[file_url],\n                language_hints=['zh',\
          \ 'en']\n            )\n            \n            if hasattr(task_response,\
          \ 'output') and task_response.output:\n                return task_response.output.task_id\n\
          \            \n            return None\n            \n        except ImportError:\n\
          \            # SDK 不可用，使用 HTTP API\n            return submit_task_http(file_url,\
          \ api_key)\n            \n    except Exception as e:\n        raise Exception(f\"\
          任务提交失败: {str(e)}\")\n\n\ndef submit_task_http(file_url: str, api_key: str)\
          \ -> str:\n    \"\"\"\n    使用 HTTP API 提交任务\n    \"\"\"\n    submit_url\
          \ = \"https://dashscope.aliyuncs.com/api/v1/services/audio/asr/transcription\"\
          \n    \n    headers = {\n        \"Authorization\": f\"Bearer {api_key}\"\
          ,\n        \"Content-Type\": \"application/json\",\n        \"X-DashScope-Async\"\
          : \"enable\"  # 启用异步模式\n    }\n    \n    payload = {\n        \"model\"\
          : \"paraformer-v1\",\n        \"input\": {\n            \"file_urls\": [file_url]\n\
          \        },\n        \"parameters\": {\n            \"language_hints\":\
          \ [\"zh\", \"en\"],\n            \"diarization_enabled\": True,  # 启用说话人分离\n\
          \            \"speaker_count\": 2  # 预估说话人数\n        }\n    }\n    \n  \
          \  req = request.Request(\n        submit_url,\n        data=json.dumps(payload).encode('utf-8'),\n\
          \        headers=headers,\n        method='POST'\n    )\n    \n    with\
          \ request.urlopen(req, timeout=60) as response:\n        result = json.loads(response.read().decode('utf-8'))\n\
          \    \n    return result.get('output', {}).get('task_id')\n\n\ndef query_task_status(task_id:\
          \ str, api_key: str) -> dict:\n    \"\"\"\n    查询任务状态\n    返回: {'status':\
          \ str, 'transcription_url': str, 'message': str}\n    \"\"\"\n    try:\n\
          \        # 尝试使用 dashscope SDK\n        try:\n            import dashscope\n\
          \            from dashscope.audio.asr import Transcription\n           \
          \ \n            dashscope.api_key = api_key\n            \n            response\
          \ = Transcription.fetch(task=task_id)\n            \n            status\
          \ = 'unknown'\n            transcription_url = None\n            message\
          \ = ''\n            \n            if hasattr(response, 'output') and response.output:\n\
          \                status = response.output.task_status\n                \n\
          \                if status == 'SUCCEEDED':\n                    results\
          \ = response.output.get('results', [])\n                    if results:\n\
          \                        transcription_url = results[0].get('transcription_url')\n\
          \                \n                elif status in ['FAILED', 'CANCELED']:\n\
          \                    message = response.output.get('message', '')\n    \
          \        \n            return {\n                'status': status,\n   \
          \             'transcription_url': transcription_url,\n                'message':\
          \ message\n            }\n            \n        except ImportError:\n  \
          \          # SDK 不可用，使用 HTTP API\n            return query_task_http(task_id,\
          \ api_key)\n            \n    except Exception as e:\n        return {\n\
          \            'status': 'error',\n            'transcription_url': None,\n\
          \            'message': str(e)\n        }\n\n\ndef query_task_http(task_id:\
          \ str, api_key: str) -> dict:\n    \"\"\"\n    使用 HTTP API 查询任务状态\n    \"\
          \"\"\n    status_url = f\"https://dashscope.aliyuncs.com/api/v1/tasks/{task_id}\"\
          \n    \n    headers = {\n        \"Authorization\": f\"Bearer {api_key}\"\
          \n    }\n    \n    req = request.Request(status_url, headers=headers)\n\
          \    \n    with request.urlopen(req, timeout=30) as response:\n        result\
          \ = json.loads(response.read().decode('utf-8'))\n    \n    output = result.get('output',\
          \ {})\n    status = output.get('task_status', 'unknown')\n    transcription_url\
          \ = None\n    message = output.get('message', '')\n    \n    if status ==\
          \ 'SUCCEEDED':\n        results = output.get('results', [])\n        if\
          \ results:\n            transcription_url = results[0].get('transcription_url')\n\
          \    \n    return {\n        'status': status,\n        'transcription_url':\
          \ transcription_url,\n        'message': message\n    }\n\n\ndef fetch_transcription_text(transcription_url:\
          \ str) -> str:\n    \"\"\"\n    从转写结果URL获取完整文本\n    \"\"\"\n    try:\n \
          \       req = request.Request(transcription_url)\n        with request.urlopen(req,\
          \ timeout=60) as response:\n            result = json.loads(response.read().decode('utf-8'))\n\
          \        \n        # 提取文本\n        transcripts = result.get('transcripts',\
          \ [])\n        if not transcripts:\n            return \"\"\n        \n\
          \        # 合并所有转写文本，保留时间戳信息\n        text_parts = []\n        \n       \
          \ for transcript in transcripts:\n            channel_id = transcript.get('channel_id',\
          \ 0)\n            sentences = transcript.get('sentences', [])\n        \
          \    \n            for sentence in sentences:\n                text = sentence.get('text',\
          \ '')\n                begin_time = sentence.get('begin_time', 0)\n    \
          \            \n                if text:\n                    # 转换时间戳为可读格式\n\
          \                    time_str = format_timestamp(begin_time)\n         \
          \           text_parts.append(f\"[{time_str}] {text}\")\n        \n    \
          \    return '\\n'.join(text_parts)\n        \n    except Exception as e:\n\
          \        raise Exception(f\"获取转写结果失败: {str(e)}\")\n\n\ndef format_timestamp(ms:\
          \ int) -> str:\n    \"\"\"\n    将毫秒时间戳转换为 HH:MM:SS 格式\n    \"\"\"\n    total_seconds\
          \ = ms // 1000\n    hours = total_seconds // 3600\n    minutes = (total_seconds\
          \ % 3600) // 60\n    seconds = total_seconds % 60\n    \n    if hours >\
          \ 0:\n        return f\"{hours:02d}:{minutes:02d}:{seconds:02d}\"\n    else:\n\
          \        return f\"{minutes:02d}:{seconds:02d}\"\n"
