    - data:
        code: "\"\"\"\n结果验证与解析节点\n验证 LLM 输出的 JSON 格式，解析失败时标记需要降级\n\"\"\"\n\nimport\
          \ json\nimport re\n\n\ndef main(llm_output: str, original_chunk: str) ->\
          \ dict:\n    \"\"\"\n    验证并解析 LLM 输出\n    \"\"\"\n    result = {\n    \
          \    \"is_valid\": False,\n        \"extracted_points\": [],\n        \"\
          summary\": \"\",\n        \"key_concepts\": [],\n        \"needs_fallback\"\
          : False,\n        \"raw_output\": llm_output,\n        \"original_chunk\"\
          : original_chunk\n    }\n    \n    try:\n        # 尝试清理并解析 JSON\n      \
          \  clean_output = clean_json_string(llm_output)\n        data = json.loads(clean_output)\n\
          \        \n        # 验证必要字段\n        points = data.get(\"extracted_points\"\
          , [])\n        summary = data.get(\"summary\", \"\")\n        concepts =\
          \ data.get(\"key_concepts\", [])\n        \n        # 检查数据质量\n        if\
          \ not points or len(points) == 0:\n            result[\"needs_fallback\"\
          ] = True\n            return result\n        \n        if not summary or\
          \ len(summary) < 10:\n            result[\"needs_fallback\"] = True\n  \
          \          return result\n        \n        # 验证通过\n        result[\"is_valid\"\
          ] = True\n        result[\"extracted_points\"] = points\n        result[\"\
          summary\"] = summary\n        result[\"key_concepts\"] = concepts\n    \
          \    result[\"needs_fallback\"] = False\n        \n        return result\n\
          \        \n    except json.JSONDecodeError:\n        # JSON 解析失败，需要降级处理\n\
          \        result[\"needs_fallback\"] = True\n        return result\n    except\
          \ Exception as e:\n        result[\"needs_fallback\"] = True\n        result[\"\
          error\"] = str(e)\n        return result\n\n\ndef clean_json_string(text:\
          \ str) -> str:\n    \"\"\"\n    清理 JSON 字符串，移除 Markdown 代码块标记\n    \"\"\"\
          \n    text = text.strip()\n    \n    # 移除 ```json ... ``` 包裹\n    if text.startswith('```'):\n\
          \        lines = text.split('\\n')\n        # 移除首行 ```json\n        if lines[0].startswith('```'):\n\
          \            lines = lines[1:]\n        # 移除末行 ```\n        if lines and\
          \ lines[-1].strip() == '```':\n            lines = lines[:-1]\n        text\
          \ = '\\n'.join(lines)\n    \n    return text.strip()\n"
