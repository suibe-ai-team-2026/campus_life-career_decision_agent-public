    - data:
        code: "\"\"\"\n降级处理节点\n当 LLM 输出格式不正确时，使用正则表达式提取内容\n\"\"\"\n\nimport re\n\n\
          \ndef main(raw_output: str, original_chunk: str) -> dict:\n    \"\"\"\n\
          \    降级提取：从非结构化文本中提取信息\n    \"\"\"\n    result = {\n        \"extracted_points\"\
          : [],\n        \"summary\": \"\",\n        \"key_concepts\": [],\n     \
          \   \"extraction_method\": \"fallback_regex\"\n    }\n    \n    try:\n \
          \       # 尝试从 raw_output 提取\n        if raw_output:\n            result\
          \ = extract_from_text(raw_output)\n        \n        # 如果仍然为空，从原文提取关键句\n\
          \        if not result[\"extracted_points\"]:\n            result = extract_from_original(original_chunk)\n\
          \        \n        result[\"extraction_method\"] = \"fallback_regex\"\n\
          \        return result\n        \n    except Exception as e:\n        #\
          \ 最后兜底：返回原文摘要\n        return {\n            \"extracted_points\": [f\"\
          内容摘要: {original_chunk[:200]}...\"],\n            \"summary\": original_chunk[:300]\
          \ + \"...\",\n            \"key_concepts\": [],\n            \"extraction_method\"\
          : \"fallback_truncate\",\n            \"error\": str(e)\n        }\n\n\n\
          def extract_from_text(text: str) -> dict:\n    \"\"\"\n    从文本中提取结构化信息\n\
          \    \"\"\"\n    result = {\n        \"extracted_points\": [],\n       \
          \ \"summary\": \"\",\n        \"key_concepts\": []\n    }\n    \n    # 提取编号列表项作为考点\n\
          \    # 匹配: 1. xxx / 1、xxx / - xxx / * xxx\n    point_patterns = [\n    \
          \    r'(?:考点|要点|知识点)?[：:]\\s*(.+?)(?=\\n|$)',\n        r'^\\s*\\d+[.、)）]\\\
          s*(.+?)(?=\\n|$)',\n        r'^\\s*[-*]\\s*(.+?)(?=\\n|$)',\n    ]\n   \
          \ \n    for pattern in point_patterns:\n        matches = re.findall(pattern,\
          \ text, re.MULTILINE)\n        if matches:\n            result[\"extracted_points\"\
          ].extend([m.strip() for m in matches[:10]])\n            break\n    \n \
          \   # 提取摘要\n    summary_patterns = [\n        r'(?:摘要|总结|概括|概述)[：:]\\s*(.+?)(?=\\\
          n\\n|$)',\n        r'(?:本段|这部分|该部分).{0,20}(?:主要|核心|重点).+?[。！]',\n    ]\n\
          \    \n    for pattern in summary_patterns:\n        match = re.search(pattern,\
          \ text, re.DOTALL)\n        if match:\n            result[\"summary\"] =\
          \ match.group(1).strip() if match.lastindex else match.group(0).strip()\n\
          \            break\n    \n    # 提取关键概念（引号或书名号内的内容）\n    concepts = re.findall(r'[「『\"\
          \"](.+?)[」』\"\"]|《(.+?)》', text)\n    result[\"key_concepts\"] = [c[0] or\
          \ c[1] for c in concepts[:10]]\n    \n    return result\n\n\ndef extract_from_original(chunk:\
          \ str) -> dict:\n    \"\"\"\n    从原文中提取关键句子\n    \"\"\"\n    sentences =\
          \ re.split(r'[。！？\\n]', chunk)\n    sentences = [s.strip() for s in sentences\
          \ if len(s.strip()) > 15]\n    \n    # 取前5个有意义的句子作为考点\n    points = sentences[:5]\n\
          \    \n    return {\n        \"extracted_points\": [f\"要点: {p}\" for p in\
          \ points],\n        \"summary\": chunk[:200] + \"...\" if len(chunk) > 200\
          \ else chunk,\n        \"key_concepts\": []\n    }\n"
        code_language: python3
