      width: 242
    - data:
        code: "\"\"\"\nDify 代码节点: 环境感知与媒体预处理\n节点名称: environment_sensing\n功能: 检测上传文件类型、音频时长、文件大小，并决定处理路由\n\
          \n输入变量:\n- files: 上传的文件列表 (Dify File 对象)\n\n输出变量:\n- file_type: 文件类型 (image/document/audio/unknown)\n\
          - file_subtype: 文件子类型 (pdf/ppt/docx/txt/mp3/wav/jpg/png)\n- duration_seconds:\
          \ 音频时长(秒)，非音频文件为0\n- file_size_mb: 文件大小(MB)\n- processing_route: 处理路由 (image/document/audio/blocked/error)\n\
          - error_message: 错误信息，无错误时为空字符串\n- file_url: 文件URL\n\"\"\"\n\nimport struct\n\
          import io\nfrom urllib import request\nfrom urllib.error import URLError\n\
          \n\ndef main(files: list) -> dict:\n    try:\n        # 1. 基础文件检测 (保持原代码逻辑)\n\
          \        if not files or len(files) == 0:\n            return {\n      \
          \          \"file_type\": \"unknown\",\n                \"file_subtype\"\
          : \"none\",\n                \"duration_seconds\": 0,\n                \"\
          file_size_mb\": 0,\n                \"processing_route\": \"text_only\"\
          ,\n                \"error_message\": \"\",\n                \"file_url\"\
          : \"\",\n                \"subject_hint\": \"通用学术\" # 默认值\n            }\n\
          \n        file_obj = files[0]\n        file_url = file_obj.url if hasattr(file_obj,\
          \ 'url') else str(file_obj)\n        file_name = file_obj.filename if hasattr(file_obj,\
          \ 'filename') else \"\"\n        \n        file_ext = get_file_extension(file_name,\
          \ file_url)\n        file_type, file_subtype = classify_file_type(file_ext)\n\
          \        file_size_mb = get_file_size(file_url)\n        \n        duration_seconds\
          \ = 0\n        if file_type == \"audio\":\n            duration_seconds\
          \ = get_audio_duration(file_url, file_ext)\n\n        # 2. 新增：学科提示检测逻辑 (subject_hint)\n\
          \        # 我们利用文件名作为最直接的判断依据\n        subject_hint = detect_subject_hint(file_name)\n\
          \n        processing_route, error_message = determine_route(\n         \
          \   file_type, duration_seconds, file_size_mb\n        )\n        \n   \
          \     return {\n            \"file_type\": file_type,\n            \"file_subtype\"\
          : file_subtype,\n            \"duration_seconds\": duration_seconds,\n \
          \           \"file_size_mb\": round(file_size_mb, 2),\n            \"processing_route\"\
          : processing_route,\n            \"error_message\": error_message,\n   \
          \         \"file_url\": file_url,\n            \"subject_hint\": subject_hint\
          \  # 输出新增变量\n        }\n        \n    except Exception as e:\n        return {\
          \            \"file_type\": \"unknown\",\n            \"file_subtype\": \"none\",\n            \"duration_seconds\": 0,\n            \"file_size_mb\": 0,\n            \"processing_route\": \"error\",\n            \"error_message\": f\"环境感知失败: {str(e)}\",\n            \"file_url\": \"\",\n            \"subject_hint\": \"通用学术\"\n        }\n\ndef detect_subject_hint(file_name: str) ->\
          \ str:\n    \"\"\"\n    始终返回 auto，强制走 LLM 智能识别学科。\n    \"\"\"\n    return \"auto\"\n\ndef get_file_extension(filename:\
          \ str, url: str) -> str:\n    \"\"\"\n    从文件名或URL中提取文件扩展名\n    \"\"\"\n\
          \    try:\n        # 优先从文件名获取\n        if filename and '.' in filename:\n\
          \            return filename.rsplit('.', 1)[-1].lower()\n        \n    \
          \    # 从URL获取\n        if url and '.' in url:\n            # 去除查询参数\n  \
          \          clean_url = url.split('?')[0]\n            return clean_url.rsplit('.',\
          \ 1)[-1].lower()\n        \n        return \"unknown\"\n    except Exception:\n\
          \        return \"unknown\"\n\n\ndef classify_file_type(ext: str) -> tuple:\n\
          \    \"\"\"\n    根据扩展名分类文件类型\n    返回: (主类型, 子类型)\n    \"\"\"\n    # 图片类型\n\
          \    image_exts = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'tiff', 'svg', 'ico', 'heic', 'heif']\n\
          \    if ext in image_exts:\n        return (\"image\", ext)\n    \n    #\
          \ 音频类型\n    audio_exts = ['mp3', 'wav', 'flac', 'aac', 'm4a', 'ogg', 'wma', 'amr', 'opus']\n\
          \    if ext in audio_exts:\n        return (\"audio\", ext)\n    \n    #\
          \ 视频类型 (作为音频处理,提取音轨)\n    video_exts = ['mp4', 'avi', 'mkv', 'mov', 'wmv', 'flv', 'webm', 'm4v']\n\
          \    if ext in video_exts:\n        return (\"audio\", ext)\n    \n    #\
          \ 文档类型\n    document_map = {\n        'pdf': 'pdf',\n        'ppt': 'ppt',\n\
          \        'pptx': 'ppt',\n        'doc': 'docx',\n        'docx': 'docx',\n\
          \        'txt': 'txt',\n        'md': 'txt',\n        'rtf': 'txt',\n        'html': 'txt',\n        'htm': 'txt',\n        'csv': 'txt',\n        'json': 'txt',\n        'xml': 'txt',\n        'xlsx': 'docx',\n        'xls': 'docx'\n   \
          \ }\n    if ext in document_map:\n        return (\"document\", document_map[ext])\n\
          \    \n    return (\"unknown\", ext)\n\n\ndef get_file_size(url: str) ->\
          \ float:\n    \"\"\"\n    获取文件大小 (MB)\n    \"\"\"\n    try:\n        req\
          \ = request.Request(url, method='HEAD')\n        with request.urlopen(req,\
          \ timeout=10) as response:\n            content_length = response.headers.get('Content-Length')\n\
          \            if content_length:\n                return int(content_length)\
          \ / (1024 * 1024)\n        return 0\n    except Exception:\n        return\
          \ 0\n\n\ndef get_audio_duration(url: str, ext: str) -> int:\n    \"\"\"\n\
          \    获取音频文件时长 (秒)\n    通过读取文件头信息获取\n    \"\"\"\n    try:\n        # 下载文件头部\
          \ (前 1MB 用于分析)\n        req = request.Request(url)\n        req.add_header('Range',\
          \ 'bytes=0-1048576')\n        \n        with request.urlopen(req, timeout=30)\
          \ as response:\n            header_data = response.read()\n        \n  \
          \      if ext == 'mp3':\n            return estimate_mp3_duration(header_data,\
          \ url)\n        elif ext == 'wav':\n            return parse_wav_duration(header_data)\n\
          \        elif ext in ['m4a', 'aac', 'mp4']:\n            return estimate_m4a_duration(header_data,\
          \ url)\n        else:\n            # 其他格式使用估算方法\n            return estimate_duration_by_size(url)\n\
          \            \n    except Exception:\n        # 如果无法获取时长，使用文件大小估算\n    \
          \    return estimate_duration_by_size(url)\n\n\ndef parse_wav_duration(data:\
          \ bytes) -> int:\n    \"\"\"\n    解析 WAV 文件时长\n    \"\"\"\n    try:\n  \
          \      if len(data) < 44:\n            return 0\n        \n        # WAV\
          \ 文件头结构\n        # 字节 22-23: 声道数\n        # 字节 24-27: 采样率\n        # 字节\
          \ 28-31: 字节率\n        # 字节 40-43: 数据大小\n        \n        if data[0:4] !=\
          \ b'RIFF' or data[8:12] != b'WAVE':\n            return 0\n        \n  \
          \      # 查找 'data' chunk\n        pos = 12\n        while pos < len(data)\
          \ - 8:\n            chunk_id = data[pos:pos+4]\n            chunk_size =\
          \ struct.unpack('<I', data[pos+4:pos+8])[0]\n            \n            if\
          \ chunk_id == b'fmt ':\n                channels = struct.unpack('<H', data[pos+10:pos+12])[0]\n\
          \                sample_rate = struct.unpack('<I', data[pos+12:pos+16])[0]\n\
          \                byte_rate = struct.unpack('<I', data[pos+16:pos+20])[0]\n\
          \            elif chunk_id == b'data':\n                if byte_rate > 0:\n\
          \                    return chunk_size // byte_rate\n                break\n\
          \            \n            pos += 8 + chunk_size\n        \n        return\
          \ 0\n    except Exception:\n        return 0\n\n\ndef estimate_mp3_duration(data:\
          \ bytes, url: str) -> int:\n    \"\"\"\n    估算 MP3 文件时长\n    通过比特率和文件大小计算\n\
          \    \"\"\"\n    try:\n        # 尝试找到 MP3 帧头\n        bitrate_table = {\n\
          \            0x0: 0, 0x1: 32, 0x2: 40, 0x3: 48,\n            0x4: 56, 0x5:\
          \ 64, 0x6: 80, 0x7: 96,\n            0x8: 112, 0x9: 128, 0xa: 160, 0xb:\
          \ 192,\n            0xc: 224, 0xd: 256, 0xe: 320, 0xf: 0\n        }\n  \
          \      \n        # 查找帧同步字节 0xFF 0xFB/0xFA/0xF3/0xF2\n        for i in range(min(len(data)\
          \ - 4, 10000)):\n            if data[i] == 0xFF and (data[i+1] & 0xE0) ==\
          \ 0xE0:\n                bitrate_index = (data[i+2] >> 4) & 0x0F\n     \
          \           bitrate = bitrate_table.get(bitrate_index, 128)\n          \
          \      \n                if bitrate > 0:\n                    # 获取文件总大小\n\
          \                    file_size = get_file_size(url)\n                  \
          \  if file_size > 0:\n                        # 时长 = 文件大小(字节) * 8 / 比特率(kbps)\
          \ / 1000\n                        duration = int((file_size * 1024 * 1024\
          \ * 8) / (bitrate * 1000))\n                        return duration\n  \
          \              break\n        \n        # 回退到基于文件大小的估算 (假设 128kbps)\n  \
          \      return estimate_duration_by_size(url)\n        \n    except Exception:\n\
          \        return estimate_duration_by_size(url)\n\n\ndef estimate_m4a_duration(data:\
          \ bytes, url: str) -> int:\n    \"\"\"\n    估算 M4A/AAC 文件时长\n    \"\"\"\n\
          \    try:\n        # M4A 使用 MP4 容器，查找 mvhd atom\n        pos = 0\n     \
          \   while pos < len(data) - 8:\n            size = struct.unpack('>I', data[pos:pos+4])[0]\n\
          \            atom_type = data[pos+4:pos+8]\n            \n            if\
          \ atom_type == b'mvhd':\n                # mvhd atom 包含时长信息\n          \
          \      version = data[pos+8]\n                if version == 0:\n       \
          \             timescale = struct.unpack('>I', data[pos+20:pos+24])[0]\n\
          \                    duration = struct.unpack('>I', data[pos+24:pos+28])[0]\n\
          \                else:\n                    timescale = struct.unpack('>I',\
          \ data[pos+28:pos+32])[0]\n                    duration = struct.unpack('>Q',\
          \ data[pos+32:pos+40])[0]\n                \n                if timescale\
          \ > 0:\n                    return duration // timescale\n            \n\
          \            if size == 0:\n                break\n            pos += size\n\
          \        \n        return estimate_duration_by_size(url)\n        \n   \
          \ except Exception:\n        return estimate_duration_by_size(url)\n\n\n\
          def estimate_duration_by_size(url: str) -> int:\n    \"\"\"\n    基于文件大小估算音频时长\n\
          \    假设平均比特率为 128kbps\n    \"\"\"\n    try:\n        file_size_mb = get_file_size(url)\n\
          \        if file_size_mb > 0:\n            # 128kbps = 16KB/s = 0.9375MB/min\n\
          \            estimated_minutes = file_size_mb / 0.9375\n            return\
          \ int(estimated_minutes * 60)\n        return 0\n    except Exception:\n\
          \        return 0\n\n\ndef determine_route(file_type: str, duration_seconds:\
          \ int, file_size_mb: float) -> tuple:\n    \"\"\"\n    根据文件类型和属性决定处理路由\n\
          \    返回: (路由名称, 错误信息)\n    \"\"\"\n    # 文件大小限制 (2GB)\n    if file_size_mb\
          \ > 2048:\n        return (\"blocked\", \"文件大小超过2GB限制，请压缩后重新上传。\")\n   \
          \ \n    # 图片路由\n    if file_type == \"image\":\n        return (\"image\"\
          , \"\")\n    \n    # 文档路由\n    if file_type == \"document\":\n        return\
          \ (\"document\", \"\")\n    \n    # 音频路由 - 弹性策略\n    if file_type == \"\
          audio\":\n        # 超长录音拦截 (>5小时 = 18000秒)\n        if duration_seconds\
          \ > 18000:\n            hours = duration_seconds / 3600\n            return\
          \ (\"blocked\", f\"该录音时长约{hours:.1f}小时，已超过单次处理上限（5小时），请分段上传以保证笔记精度。\")\n\
          \        \n        # 长录音 (>=2分钟 = 120秒)\n        if duration_seconds >=\
          \ 120:\n            return (\"audio_async\", \"\")\n        \n        #\
          \ 短录音 (<2分钟)\n        return (\"audio_sync\", \"\")\n    \n    # 未知类型\n\
          \    if file_type == \"unknown\":\n        return (\"error\", \"不支持的文件格式，请上传\
          \ PDF、PPT、Word、图片或音频文件。\")\n    \n    return (\"error\", \"文件类型识别失败\")\n"
