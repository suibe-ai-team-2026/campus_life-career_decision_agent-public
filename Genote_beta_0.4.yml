    - data:
        code: "\"\"\"\nDify 代码节点: Reduce阶段 - 全局聚合与润色\n节点名称: reduce_aggregate\n功能:\
          \ 汇总所有局部考点，去重、润色，生成最终的\"上岸笔记\"\n      使用 DeepSeek-V3 模型\n\n输入变量:\n- map_results:\
          \ Map阶段的所有结果列表\n- original_query: 用户原始问题 (可选)\n- subject_hint: 学科提示 (可选)\n\
          \n输出变量:\n- final_notes: 最终笔记 (Markdown格式)\n- total_points: 总考点数\n- key_concepts:\
          \ 去重后的关键概念列表\n- error_message: 错误信息\n\nToken 限制:\n- max_tokens: 8000 (全局总结阶段，分配更多算力)\n\
          \"\"\"\n\nimport os\nimport json\nfrom urllib import request\nfrom urllib.error\
          \ import URLError\n\n\n# Token 配置 - 全局总结阶段分配更多算力\nMAX_TOKENS = 8000\n\n\n\
          def main(map_results: list, original_query: str = \"\", \n         subject_hint:\
          \ str = \"\") -> dict:\n    \"\"\"\n    主函数: 全局聚合与润色\n    \"\"\"\n    try:\n\
          \        # 验证输入\n        # 优先检查是否有用户文本输入
        if original_query and original_query.strip() and (not map_results or all(not r for r in map_results)):
            # 纯文字输入场景：基于用户输入生成笔记
            return generate_notes_from_text(original_query, subject_hint)
        
        if not map_results or all(not r for r in map_results):\n            return {\n   \
          \             \"final_notes\": generate_fallback_notes(subject_hint, original_query),\n                \"total_points\":\
          \ 1,\n                \"key_concepts\": [\"待补充\"],\n                \"error_message\"\
          : \"\"\n            }\n        \n        # 合并所有局部结果\n        merged_data\
          \ = merge_map_results(map_results)\n        \n        # 如果内容较少，直接格式化输出\n\
          \        if merged_data[\"total_points\"] <= 10:\n            final_notes\
          \ = format_simple_notes(merged_data, subject_hint)\n            return {\n\
          \                \"final_notes\": final_notes,\n                \"total_points\"\
          : merged_data[\"total_points\"],\n                \"key_concepts\": merged_data[\"\
          key_concepts\"],\n                \"error_message\": \"\"\n            }\n\
          \        \n        # 构建聚合提示词\n        prompt = build_aggregation_prompt(merged_data,\
          \ original_query, subject_hint)\n        \n        # 调用 DeepSeek-V3 模型\n\
          \        response = call_deepseek(prompt)\n        \n        # 后处理\n   \
          \     final_notes = post_process_notes(response)\n        \n        return\
          \ {\n            \"final_notes\": final_notes,\n            \"total_points\"\
          : merged_data[\"total_points\"],\n            \"key_concepts\": merged_data[\"\
          key_concepts\"],\n            \"error_message\": \"\"\n        }\n     \
          \   \n    except Exception as e:\n        return {\n            \"final_notes\"\
          : \"\",\n            \"total_points\": 0,\n            \"key_concepts\"\
          : [],\n            \"error_message\": f\"全局聚合失败: {str(e)}\"\n        }\n\
          \n\ndef generate_notes_from_text(text: str, subject_hint: str) -> dict:\n\
          \    \"\"\"\"\n    基于用户纯文字输入直接生成笔记\n    \"\"\"\"\n    subject = subject_hint if subject_hint and subject_hint != \"auto\" else \"通用学术\"\n    notes = f\"# 📚 {subject}学习笔记\\n\\n## 📝 内容记录\\n\\n{text}\\n\\n## 💡 学习建议\\n\\n请基于以上内容进行深入学习和复习。\"\n    return {\n        \"final_notes\": notes,\n        \"total_points\": 1,\n        \"key_concepts\": [],\n        \"error_message\": \"\"\n    }\n\ndef generate_fallback_notes(subject_hint: str, query: str) -> str:\n\
          \    \"\"\"\n    当无法解析内容时,生成兜底笔记框架\n    \"\"\"\n    subject = subject_hint if subject_hint and subject_hint != \"auto\" else \"通用学术\"\n    query_line = f\"您的关注点是：{query}\" if query else \"\"\n    return f\"\"\"\"# 📚 {subject}学习笔记\n\n> ⚠️ 提示: 当前内容解析结果较少，建议检查上传文件的格式和内容。\n\n## 内容概要\n本次上传的学习材料正在处理中。{query_line}\n\n## 学习建议\n1. 请确认上传的文件格式正确（支持 PDF、Word、PPT、图片、音频、视频）\n2. 对于扫描版 PDF，建议使用更高清晰度的源文件\n3. 长录音请确保音频质量，避免过多噪音\n\n## 后续步骤\n- 如需重新生成笔记，请优化源文件后再次上传\"\"\"\n\ndef merge_map_results(map_results: list) -> dict:\n    \"\"\"\n    合并所有Map阶段的结果（增强兼容性版）\n\
          \    \"\"\"\n    all_points = []\n    all_summaries = []\n    all_concepts\
          \ = set()\n    \n    for result in map_results:\n        # 跳过空值\n        if result is None or result == \"\":\n            continue\n        data = result\n\
          \        # 如果传入的是字符串（Dify 常见情况），尝试解析为 JSON\n        if isinstance(result,\
          \ str):\n            try:\n                data = json.loads(result)\n \
          \           except:\n                # 如果不是 JSON 格式，将其视作纯文本考点\n        \
          \        if result.strip():\n                    all_points.append(result.strip())\n                continue\n\n       \
          \ if isinstance(data, list):\n            # 处理嵌套数组情况\n            for item in data:\n                if isinstance(item, str) and item.strip():\n                    all_points.append(item.strip())\n            continue\n        if isinstance(data, dict):\n            # 1. 收集考点 (兼容 extracted_points)\n\
          \            points = data.get(\"extracted_points\", [])\n            if\
          \ isinstance(points, list):\n                all_points.extend(points)\n\
          \            elif isinstance(points, str) and points:\n                all_points.append(points)\n\
          \            \n            # 2. 收集摘要 (兼容 summary)\n            summary =\
          \ data.get(\"summary\", \"\")\n            if summary:\n               \
          \ all_summaries.append(summary)\n            \n            # 3. 收集概念 (兼容\
          \ key_concepts)\n            concepts = data.get(\"key_concepts\", [])\n\
          \            if isinstance(concepts, list):\n                all_concepts.update(concepts)\n\
          \    \n    return {\n        \"all_points\": all_points,\n        \"all_summaries\"\
          : all_summaries,\n        \"key_concepts\": list(all_concepts),\n      \
          \  \"total_points\": len(all_points)\n    }\ndef format_simple_notes(merged_data:\
          \ dict, subject_hint: str) -> str:\n    \"\"\"\n    简单格式化笔记 (考点较少时使用)\n\
          \    \"\"\"\n    notes = []\n    \n    # 标题\n    title = f\"# {subject_hint}学习笔记\"\
          \ if subject_hint else \"# 学习笔记\"\n    notes.append(title)\n    notes.append(\"\
          \")\n    \n    # 内容概要\n    if merged_data[\"all_summaries\"]:\n        notes.append(\"\
          ## 内容概要\")\n        notes.append(\"\")\n        for summary in merged_data[\"\
          all_summaries\"]:\n            notes.append(f\"> {summary}\")\n        notes.append(\"\
          \")\n    \n    # 核心考点\n    if merged_data[\"all_points\"]:\n        notes.append(\"\
          ## 核心考点\")\n        notes.append(\"\")\n        for i, point in enumerate(merged_data[\"\
          all_points\"], 1):\n            notes.append(f\"**{i}.** {point}\")\n  \
          \          notes.append(\"\")\n    \n    # 关键概念\n    if merged_data[\"key_concepts\"\
          ]:\n        notes.append(\"## 关键概念\")\n        notes.append(\"\")\n    \
          \    notes.append(\"、\".join(merged_data[\"key_concepts\"]))\n        notes.append(\"\
          \")\n    \n    return \"\\n\".join(notes)\n\n\ndef build_aggregation_prompt(merged_data:\
          \ dict, original_query: str, \n                            subject_hint:\
          \ str) -> str:\n    \"\"\"\n    构建全局聚合提示词\n    \"\"\"\n    subject_context\
          \ = f\"学科领域: {subject_hint}\\n\" if subject_hint else \"\"\n    query_context\
          \ = f\"用户关注点: {original_query}\\n\" if original_query else \"\"\n    \n\
          \    # 格式化考点列表\n    points_text = \"\\n\".join([f\"- {p}\" for p in merged_data[\"\
          all_points\"]])\n    \n    # 格式化摘要列表\n    summaries_text = \"\\n\".join([f\"\
          - {s}\" for s in merged_data[\"all_summaries\"]])\n    \n    # 格式化概念列表\n\
          \    concepts_text = \"、\".join(merged_data[\"key_concepts\"])\n    \n \
          \   prompt = f\"\"\"你是一位资深的学术导师，风格沉稳、简雅、逻辑性极强。\n现在需要你将分散的学习笔记整合为一份完整的\"\
          上岸笔记\"。\n\n{subject_context}{query_context}\n\n【原始考点汇总】\n{points_text}\n\
          \n【各部分摘要】\n{summaries_text}\n\n【关键概念】\n{concepts_text}\n\n【整合要求】\n1. **去重合并**:\
          \ 识别重复或相似的考点，合并为一条\n2. **逻辑重组**: 按知识体系重新组织，建立清晰的层级结构\n3. **润色提升**: 使表述更加精准、专业，便于记忆\n\
          4. **补充关联**: 标注考点之间的关联关系\n\n【输出格式要求】\n请使用 Markdown 格式输出，包含以下结构:\n\n```markdown\n\
          # [主题名称]学习笔记\n\n## 内容概要\n> 用2-3句话概括全部内容的核心要义\n\n## 知识框架\n[用简洁的层级结构展示知识体系]\n\
          \n## 核心考点\n\n### 一、[第一大类]\n**1.1 [考点名称]**\n- 要点描述\n- 关键公式/定义\n\n### 二、[第二大类]\n\
          ...\n\n## 重点概念速查\n| 概念 | 定义 | 关联考点 |\n|-----|------|---------|\n| ... |\
          \ ...  | ...     |\n\n## 复习建议\n[针对性的学习建议]\n```\n\n注意:\n- 保持学术导师的专业风格\n-\
          \ 使用多级标题组织内容\n- 重要内容使用**粗体**标注\n- 适当使用表格整理对比性内容\n- 确保笔记完整，不遗漏任何重要考点\"\"\"\
          \n\n    return prompt\n\n\ndef call_deepseek(prompt: str) -> str:\n    \"\
          \"\"\n    调用 DeepSeek-V3 模型\n    \"\"\"\n    api_key = os.environ.get('DASHSCOPE_API_KEY',\
          \ '')\n    \n    if not api_key:\n        raise Exception(\"未配置 DASHSCOPE_API_KEY\"\
          )\n    \n    url = \"https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions\"\
          \n    \n    headers = {\n        \"Authorization\": f\"Bearer {api_key}\"\
          ,\n        \"Content-Type\": \"application/json\"\n    }\n    \n    payload\
          \ = {\n        \"model\": \"deepseek-v3\",\n        \"messages\": [\n  \
          \          {\n                \"role\": \"system\",\n                \"\
          content\": \"你是一位资深的学术导师，风格沉稳、简雅、逻辑性极强。请用中文回复，使用Markdown格式。\"\n        \
          \    },\n            {\n                \"role\": \"user\",\n          \
          \      \"content\": prompt\n            }\n        ],\n        \"max_tokens\"\
          : MAX_TOKENS,\n        \"temperature\": 0.5,  # 适中温度，平衡创造性和稳定性\n    }\n\
          \    \n    req = request.Request(\n        url,\n        data=json.dumps(payload).encode('utf-8'),\n\
          \        headers=headers,\n        method='POST'\n    )\n    \n    try:\n\
          \        with request.urlopen(req, timeout=180) as response:\n         \
          \   result = json.loads(response.read().decode('utf-8'))\n        \n   \
          \     choices = result.get('choices', [])\n        if choices:\n       \
          \     return choices[0].get('message', {}).get('content', '')\n        \n\
          \        raise Exception(\"未获取到模型回复\")\n        \n    except URLError as\
          \ e:\n        raise Exception(f\"API调用失败: {str(e)}\")\n\n\ndef post_process_notes(notes:\
          \ str) -> str:\n    \"\"\"\n    后处理笔记内容\n    \"\"\"\n    if not notes:\n\
          \        return \"\"\n    \n    # 移除可能的代码块标记\n    notes = notes.strip()\n\
          \    if notes.startswith('```markdown'):\n        notes = notes[11:]\n \
          \   if notes.startswith('```'):\n        notes = notes[3:]\n    if notes.endswith('```'):\n\
          \        notes = notes[:-3]\n    \n    # 确保标题格式正确\n    lines = notes.split('\\\
          n')\n    processed_lines = []\n    \n    for line in lines:\n        # 修复可能的标题格式问题\n\
          \        if line.strip().startswith('#') and not line.startswith('#'):\n\
          \            line = line.lstrip()\n        processed_lines.append(line)\n\
          \    \n    return '\\n'.join(processed_lines).strip()\n"
        code_language: python3
