version: 0.1.x
name: "生思笔记 (Genote) - AI 知识库助手"
description: "在 Dify 上导入使用的 Genote AI 知识库助手，支持 PDF/Word/图片/音频多路解析、聚合与 Map-Reduce 重组为结构化 Markdown 笔记。"
settings:
  provider: openai-compatible
  default_model: deepseek-v3
  temperature: 0.3
  file_size_limit_mb: 20
  per_user_hourly_call_limit: 60

nodes:
  - id: env_sensing
    type: trigger
    name: Environment Sensing
    description: "初始节点，识别用户上传文件类型（PDF、Word、图片、音频）并按类型路由"
    config:
      accept_types:
        - "application/pdf"
        - "application/msword"
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        - "image/*"
        - "audio/*"
      max_file_size_mb: 20
    outputs:
      - pdf
      - docx
      - image
      - audio

  - id: multi_route_parsing
    type: parallel
    name: Multi-route Parsing
    description: "并行处理节点：PDF 提取文字、DOCX 解析、图片 OCR、音频异步转写"
    branches:
      - id: pdf_branch
        name: PDF Text Extractor
        type: extractor
        handler: pdf_text_extractor
        outputs:
          - pdf_text
      - id: docx_branch
        name: DOCX Text Extractor
        type: extractor
        handler: docx_text_extractor
        outputs:
          - docx_text
      - id: image_branch
        name: Image OCR
        type: ocr
        handler: image_ocr
        outputs:
          - image_text
      - id: audio_branch
        name: Audio Transcription (Async)
        type: async_transcription
        handler: speech_to_text
        async: true
        description: "长音频异步转写，完成后将 transcript 返回"
        outputs:
          - audio_text

  - id: variable_aggregator
    type: function
    name: Variable Aggregator
    description: "聚合所有解析输出为唯一变量 merged_text"
    inputs:
      - pdf_text
      - docx_text
      - image_text
      - audio_text
    outputs:
      - merged_text
    code: |
      # Merge non-empty parts into a single merged_text string with clear separations.
      merged = []
      for key in ["pdf_text", "docx_text", "image_text", "audio_text"]:
        v = inputs.get(key)
        if v:
          merged.append(v.strip())
      outputs["merged_text"] = "\n\n".join(merged)

  - id: reduce_aggregate
    type: map_reduce
    name: Reduce Aggregate (Map-Reduce)
    description: "对 Array[String] 使用 Map-Reduce，调用 deepseek-v3 将零散考点重组为具备“上岸品质”的结构化 Markdown 笔记"
    inputs:
      - name: chunks
        type: Array[String]
        source: variable_aggregator.merged_text
        chunk_strategy:
          type: smart_split
          max_chunk_tokens: 1000
    mapper:
      model:
        provider: openai-compatible
        model: deepseek-v3
        temperature: 0.3
      instruction: |
        对当前文本块提取：要点、概念、关键事实、典型例题与答案框架、可能考点与短问题。输出标准化 JSON：{"id": "...", "titles": [...], "facts": [...], "questions": [...], "examples": [...], "source": "..."}。
    reducer:
      model:
        provider: openai-compatible
        model: deepseek-v3
        temperature: 0.3
      instruction: |
        汇总 mapper 的 JSON 列表，生成一份结构化、可直接复习的 Markdown 笔记。要求：清晰标题 (H1/H2/H3)、分段要点、要点序列化（编号/项目符号）、典型例题与解题思路、参考来源标注（若可推断出文件名）。学术严谨性优先，避免主观扩展。
    outputs:
      - final_markdown

  - id: answer_node
    type: answer
    name: Answer (Markdown Preview)
    description: "输出最终 Markdown，并在 UI 中启用 Markdown 预览"
    inputs:
      - final_markdown
    ui:
      markdown_preview: true
      allow_copy_raw: true
    outputs:
      - response

controls:
  rate_limits:
    per_user:
      period_seconds: 3600
      max_calls: 60
  file_limits:
    max_upload_size_mb: 20

security:
  sanitize_inputs: true
  enforce_rate_limits: true
  max_variable_length_chars: 200000

models:
  - id: deepseek-v3
    provider: openai-compatible
    model: deepseek-v3
    temperature: 0.3
    description: "用于 Map-Reduce 的生成模型，保证学术严谨性"

triggers:
  on_file_upload:
    entry_node: env_sensing

export:
  format: dify-dsl
  version: 0.1.x