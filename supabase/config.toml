# Supabase CLI project config. Management commands use SUPABASE_ACCESS_TOKEN from
# the protected local env; this file contains no secrets and no project ref.
project_id = "campus-pathway-career"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000"]
enable_anonymous_sign_ins = true

[auth.rate_limit]
anonymous_users = 30
